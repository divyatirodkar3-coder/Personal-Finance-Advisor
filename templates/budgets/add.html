{% extends "base.html" %}
{% block title %}Set Budget{% endblock %}

{% block content %}
<div class="auth-wrap" style="max-width:560px;">
    <div class="card">
        <div class="card-header">
            <h2>Set a Budget</h2>
            <a href="{{ url_for('budgets.index') }}" class="btn btn-secondary btn-sm">Back</a>
        </div>

        <form method="POST" action="{{ url_for('budgets.add') }}" novalidate>
            <div class="form-group">
                <label for="month">Month *</label>
                <input type="month" id="month" name="month"
                       value="{{ form.month }}" required>
            </div>

            <div class="form-group">
                <label for="budget_type">What kind of budget? *</label>
                <select id="budget_type" name="budget_type">
                    <option value="category" {{ 'selected' if form.budget_type != 'overall' else '' }}>
                        Budget for ONE category (e.g. Food max 3000)
                    </option>
                    <option value="overall" {{ 'selected' if form.budget_type == 'overall' else '' }}>
                        OVERALL monthly budget (all spending combined)
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="category_id">Category *</label>
                <select id="category_id" name="category_id">
                    <option value="">-- choose a category --</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}"
                            {{ 'selected' if form.category_id|string == category.id|string else '' }}>
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
                <p class="muted" style="font-size:.82rem; margin-top:5px;">
                    Ignore this if you chose an OVERALL budget.
                </p>
            </div>

            <div class="form-group">
                <label for="amount">Budget amount *</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                       value="{{ form.amount }}" placeholder="e.g. 3000" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Budget</button>
                <a href="{{ url_for('budgets.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>

        <p class="muted" style="font-size:.85rem; margin-top:16px;">
            Setting a budget twice for the same month and category simply
            updates the old one, so you never end up with duplicates.
        </p>
    </div>
</div>
{% endblock %}
